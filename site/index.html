<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Database</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Music Database</a>
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Search artists…" autocomplete="off" />
      <div id="search-results" class="search-results" hidden></div>
    </div>
  </header>

  <main id="app">
    <div id="loading" class="loading">Loading your music database…</div>
  </main>

  <footer class="footer">
    <span id="footer-status"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
